{{- $sections := where .Ancestors "IsHome" false -}}
{{- if and (not .IsHome) $sections -}}
<p style="margin-bottom: 0;">
  <a href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
  {{- range $sections.Reverse -}}
  &nbsp;/&nbsp;<a href="{{ .Permalink }}">{{ .Title }}</a>
  {{- end -}}
  &nbsp;/&nbsp;{{ .Title }}
</p>
{{- end -}}
